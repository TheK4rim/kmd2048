name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: CPython ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.8 and 3.9 are end-of-life: actions/setup-python ships them
          # for ubuntu-24.04 but not for newer images such as ubuntu-latest.
          - { python-version: "3.8", os: ubuntu-24.04 }
          - { python-version: "3.9", os: ubuntu-24.04 }
          - { python-version: "3.10", os: ubuntu-latest }
          - { python-version: "3.11", os: ubuntu-latest }
          - { python-version: "3.12", os: ubuntu-latest }
          - { python-version: "3.13", os: ubuntu-latest }
          - { python-version: "3.14", os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite
        run: python -m unittest -v test_kmd2048

      - name: Benchmark smoke run (timings on shared CI runners are not representative)
        run: python benchmark.py --quick

      - name: Hash a file with the command-line tool
        run: python kmd2048.py README.md
